; ---------------------------------------------------------------------------------------------------------
; Burrowing. A burrower in combat that is far from its target or makes no progress toward it digs into the
; ground, travels unseen under a moving dust trail and bursts out next to the target.
; Only on soft ground (dirt, sand, snow, grass, mud, gravel, ash) at both ends.
; Each creature has its own section:
;   bBurrow        false = this creature never burrows.
;   fBurrowChance  how often it burrows when it could (0-1); scaled by distance, see [Burrow].
; ---------------------------------------------------------------------------------------------------------

[Burrow]
; At most this many creatures are underground at once.
iMaxBurrowers = 2
; Travel speed underground (u/s).
fSpeed = 500
; Only for targets within fEngage and no more than fMaxRise higher or lower.
fEngage = 2500
fMaxRise = 250
; A creature closer to its target than fMinDist never burrows. Beyond that the chance grows with distance:
; the creature's own fBurrowChance is multiplied by fNearChance right at fMinDist, rising to fFarChance at
; fFarDist and beyond (the result is capped at 100%). It decides once every fRetrySec seconds.
fMinDist = 450
fFarDist = 1500
fNearChance = 0.2
fFarChance = 2.0
; A creature that has made no progress for this many seconds uses the far chance at any distance beyond fMinDist.
fStuckSec = 2
; Wait this long after surfacing before it may burrow again.
fCooldown = 12
; After a creature decides not to burrow (fBurrowChance), it waits this long before deciding again.
fRetrySec = 8
; Time to dig in and to climb out (s), and how deep it travels.
fDigSec = 0.9
fRiseSec = 0.5
fDepth = 140
; It surfaces this far from the target.
fExitDist = 90
; It surfaces where it is after this many seconds underground.
fMaxSeconds = 10
; Size of the dust burst and trail.
fBurstScale = 1.0
; Chaurus are big: they also throw up rocks when they burst out.
bChaurusRocks = true
; A target standing within fStaggerDist of the exit staggers.
bStagger = true
fStaggerDist = 110
; Camera shake when something bursts out near you.
bCameraShake = true
bLog = false

[Mudcrab]
bBurrow = true
fBurrowChance = 1.0

[Skeever]
bBurrow = true
fBurrowChance = 1.0

[AshHopper]
bBurrow = true
fBurrowChance = 1.0

[Chaurus]
bBurrow = true
fBurrowChance = 0.25

[AshSpawn]
bBurrow = true
fBurrowChance = 1.0
