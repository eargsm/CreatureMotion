fBurrowChance = 1.0

; ---------------------------------------------------------------------------------------------------------
; Wall crawling. A crawler in combat whose target is above it, or that is stuck in place, heads straight for
; it over whatever is in the way: up walls, cliffs and rocks, keeping its own walk animation with its body
; turned to stand on the surface.
;   bCrawl  false = this creature never climbs (set in the creature's own section).
; ---------------------------------------------------------------------------------------------------------

[Crawl]
; At most this many creatures climb at once.
iMaxCrawlers = 4
; Climbing speed (u/s) and acceleration.
fSpeed = 230
fAccel = 600
; Only for targets within this distance.
fEngage = 2500
; Start when the target is at least this much higher...
fMinRise = 120
; ...or when it has stood still for a second and not got closer for this many seconds.
fStuckSec = 2
; It lets go this close to the target.
fStopDist = 120
; How far the creature's collision is held off the wall.
fStandOff = 30
; Give up after this many seconds, then wait fCooldown before trying again.
fMaxSeconds = 25
fCooldown = 4
; Procedural legs: the legs of these creatures stop following the walk animation, on the
; ground and on walls. Each foot is planted and stays there while the body moves on, then steps forward; legs
; take turns. fFootReach is how far above or below the body's own surface a foot looks for ground.
; Each creature has its own walk, set in its own section, as fractions of how far its leg can reach:
;   fStepLength  how long a step is.
;   fStepHeight  how high the foot lifts during a step.
;   fStance      how far out from the hip a foot rests (higher = wider stance, straighter legs).
;   fSwing       share of each step cycle a foot spends in the air (lower = longer hold, quicker step).
;   fArch        0-1, how strongly the knee is turned to point away from the ground, as on a spider.
;   fFan         0-1, how much the legs fan out around the body: front legs forward, back legs backward.
bProceduralLegs = true
fFootReach = 40
bLog = false

[FrostbiteSpider]
bCrawl = true
fStepLength = 0.4
fStepHeight = 0.2
fStance = 0.75
fSwing = 0.35
fArch = 1.0
fFan = 0.6

