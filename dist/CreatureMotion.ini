; Creature Motion
;   Flight: Chaurus Hunter, Ice Wraith, Wisp, Wispmother, Netch, Seeker, Flame Atronach, Storm Atronach, Dragon Priest,
;           Soul Cairn Wisp, Vampire Lord.
;   Burrowing: Mudcrab, Ash Hopper, Chaurus, Chaurus Reaper, Ash Spawn.
;   Wall crawling: Chaurus, Chaurus Reaper, Frostbite Spider, Dwarven Spider, Ash Hopper.
; The per-creature switches below can also be changed in game with SKSE Menu Framework (Creature Motion > Creatures).
; Re-read every time you load a save.
; Log: Documents\My Games\Skyrim Special Edition\SKSE\CreatureMotion.log

; ---------------------------------------------------------------------------------------------------------
; Flight. A flyer in combat flies straight to its target through open air, steering around obstacles.
; Melee creatures settle on the ground next to it; spell casters (Wispmother, Seeker, Flame and Storm
; Atronach, Dragon Priest, Vampire Lord) stay in the air above it for a while.
; Each creature has its own section:
;   bFlight    false = this creature never flies.
;   fSpeed     flight speed (u/s).
;   fStopDist  it stops this far from the target.
;   fHover     flying height above the ground and above the target.
; ---------------------------------------------------------------------------------------------------------

[Flight]
; At most this many creatures fly at once.
iMaxFlyers = 8
; true = flying is how these creatures chase: in combat they take off whenever the target is out of reach and
; fly to it. false = they only fly when they have to (target above, no progress, or about to walk off a ledge),
; and spell casters only when they can't see the target.
bAlwaysFly = true
fAccel = 700
; Only for targets within this distance.
fEngage = 3000
; Start when the target is at least this much higher...
fMinRise = 120
; ...or after this many seconds without getting closer.
fStuckSec = 2
; Give up after this many seconds (it comes down where it is), then wait fCooldown before trying again.
fMaxSeconds = 25
fCooldown = 4
; Spell casters don't come down when they arrive: they stay in the air near the target, facing it, for a random
; time between these two values (seconds), then lower to the ground.
fHoverSecMin = 6
fHoverSecMax = 14
; How fast floating creatures sink when they come down (u/s). They ease into the descent and slow again
; just above the ground. The Chaurus Hunter keeps its own quick landing.
fLandSpeed = 110
; Ledges: a floating creature that is about to move off a drop deeper than fLedgeDrop, or is already falling
; off one, takes to the air instead of dropping. Where there is no floor under it when it arrives, it keeps
; hovering instead of falling. The Chaurus Hunter is not affected.
bLedge = true
fLedgeDrop = 180
; Target on high ground: a flyer that is not a spell caster but has a ranged attack of its own (the Chaurus
; Hunter's spit, for example) usually keeps its distance and attacks from the air, like the casters do,
; instead of landing next to the target. fRangedChance is how often (0-1); the rest of the time it closes in.
; fRangedDist is how far away it stays.
fRangedChance = 0.75
fRangedDist = 450
; When its hover time is up it closes in and lands next to the target.
bLog = false

